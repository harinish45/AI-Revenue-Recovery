name: RecoverAI Frontend CI

on:
  push:
    branches: [main, frontend-dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
      # Fails the build on known high/critical CVEs in npm dependencies.
      - run: npm audit --audit-level=high
