services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      # Optional: a root .env (see .env.example) overrides anything below --
      # e.g. real Razorpay test keys. A fresh clone has no .env file yet,
      # and that must never stop the container from starting.
      - path: .env
        required: false
    environment:
      # Safe, zero-config demo defaults so a fresh clone with no .env file
      # still boots straight into a fully working, seedable demo.
      DEMO_MODE: ${DEMO_MODE:-true}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    networks:
      - recoverai

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      # nginx serves the built static frontend on container port 80;
      # exposed on host :3000 (not :5173, which is the Vite dev server port)
      - "3000:80"
    networks:
      - recoverai

networks:
  recoverai:
    driver: bridge
