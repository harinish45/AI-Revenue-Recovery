services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - recoverai

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      # nginx serves the built static frontend on container port 80;
      # exposed on host :3000 (not :5173, which is the Vite dev server port)
      - "3000:80"
    networks:
      - recoverai

networks:
  recoverai:
    driver: bridge
