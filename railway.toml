# railway.toml — Railway.app deployment config
# One-click deploy: railway up

[build]
builder = "nixpacks"

[[services]]
name = "recoverai-backend"
source = "backend"
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[services.env]
  DATABASE_URL = "sqlite:///./recoverai.db"
  APP_ENV = "production"
  CORS_ORIGINS = "*"

# Frontend is served as static files by FastAPI (see main.py)
# So we only need one service
