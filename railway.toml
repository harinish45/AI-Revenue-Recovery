# railway.toml — Railway.app deployment config
# One-click deploy: railway up

[build]
builder = "nixpacks"

[[services]]
name = "recoverai"
# source is the repo root (not backend/) so RecoverAI-standalone.html — served
# at "/" via a path relative to backend/app/main.py — is present in the build.
buildCommand = "cd backend && pip install -r requirements.txt"
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[services.env]
  DATABASE_URL = "sqlite:///./recoverai.db"
  APP_ENV = "production"
  # Same-origin standalone UI needs no cross-origin access. Configure an
  # explicit allowlist only when a separate frontend is deployed.
  CORS_ORIGINS = '[]'

# This single service serves both the API and the app UI (RecoverAI-standalone.html, at "/").
