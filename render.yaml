# This single service serves both the API and the app UI (RecoverAI-standalone.html, at "/").
services:
  - type: web
    name: recoverai
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./recoverai.db
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '["*"]'
