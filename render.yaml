# Render Blueprint configuration for RecoverAI
# Serves both the FastAPI backend and the standalone web dashboard at "/"
services:
  - type: web
    name: recoverai
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./recoverai.db
      - key: APP_ENV
        value: production
      # DEMO_MODE defaults to false: /api/demo/* routes are hard-disabled
      # in production regardless of any environment setting.
      - key: RAZORPAY_SIMULATE
        value: "true"
      - key: CORS_ORIGINS
        value: '[]'
      # Optional: set a secret value in the Render dashboard to require
      # X-Demo-Token wherever demo controls are enabled.
      - key: DEMO_API_TOKEN
        sync: false
      # main.py refuses to boot with APP_ENV=production unless both of
      # these are non-empty. Generate API_KEYS here so a first deploy cannot
      # fail at startup because a required secret was left blank. Replace the
      # generated value in Render with "<your-key>:operator" before using
      # mutating API endpoints; the generated default is readonly.
      - key: API_KEYS
        generateValue: true
      # AUDIT_SIGNING_KEY just needs to be a stable secret nobody can
      # guess -- Render generates and stores one automatically.
      - key: AUDIT_SIGNING_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
