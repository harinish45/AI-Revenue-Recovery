# Render Blueprint configuration for RecoverAI
# Serves both the FastAPI backend and the standalone web dashboard at "/"
services:
  - type: web
    name: recoverai
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./recoverai.db
      - key: APP_ENV
        value: production
      - key: RAZORPAY_SIMULATE
        value: "true"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: PYTHON_VERSION
        value: 3.11.9
