# Render Blueprint configuration for RecoverAI
# Serves both the FastAPI backend and the standalone web dashboard at "/"
services:
  - type: web
    name: recoverai
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./recoverai.db
      # This is a public, zero-login buildathon demo -- RAZORPAY_SIMULATE is
      # always "true" and no real payment credentials are ever wired in, so
      # APP_ENV stays "development" here on purpose: it's the same mode you
      # run locally, which is what makes the standalone dashboard usable
      # with no API key and lets /api/demo/* seed and reset the board. Do
      # not flip this to "production" without also giving the frontend a
      # way to send X-API-Key -- it doesn't today.
      - key: APP_ENV
        value: development
      - key: DEMO_MODE
        value: "true"
      - key: RAZORPAY_SIMULATE
        value: "true"
      - key: CORS_ORIGINS
        value: '[]'
      # Optional: set a secret value in the Render dashboard to require
      # X-Demo-Token wherever demo controls are enabled.
      - key: DEMO_API_TOKEN
        sync: false
      # Not required outside production, but generating a stable one anyway
      # keeps the audit hash-chain verifiable across Render's free-tier
      # restarts instead of rotating to a new random key every boot.
      - key: AUDIT_SIGNING_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
