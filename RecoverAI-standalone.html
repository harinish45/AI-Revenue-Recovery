<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RecoverAI — Autonomous Revenue Recovery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= RESET & TOKENS ============================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000000; --bg-1:#0a0a0a; --bg-2:#111214; --bg-3:#17181b; --bg-4:#1f2023;
  --border:#26272b; --border-soft:#1b1c1f;
  --text-hi:#f5f6f7; --text:#c9cbd1; --text-dim:#8b8d94; --text-faint:#5a5c62;
  --accent:#7c5cff; --accent-2:#4f8cff; --accent-soft:rgba(124,92,255,.14);
  --green:#22c55e; --green-soft:rgba(34,197,94,.14);
  --red:#f4515f; --red-soft:rgba(244,81,95,.14);
  --amber:#f5a623; --amber-soft:rgba(245,166,35,.14);
  --cyan:#2dd4d4; --cyan-soft:rgba(45,212,212,.14);
  --radius:10px; --radius-lg:16px;
  --font-head:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --shadow-lg:0 20px 60px rgba(0,0,0,.6);
}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,h4{font-family:var(--font-head);color:var(--text-hi);font-weight:600;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;color:var(--text-hi);}
::selection{background:var(--accent-soft);color:#fff;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#3a3b40;}
.mono{font-family:var(--font-mono);}
a{color:inherit;}

/* ============================= APP SHELL ============================= */
#app{display:grid;grid-template-columns:248px 1fr;height:100vh;width:100vw;}

/* ---------- Sidebar ---------- */
.sidebar{background:var(--bg-1);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid var(--border-soft);}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset;}
.brand-name{font-family:var(--font-head);font-weight:700;font-size:15.5px;color:var(--text-hi);letter-spacing:-.02em;}
.brand-sub{font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);letter-spacing:.02em;}
.nav{padding:14px 10px;flex:1;}
.nav-group{margin-bottom:18px;}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);padding:0 10px 6px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-dim);font-size:13.2px;font-weight:500;cursor:pointer;transition:background .12s,color .12s;position:relative;margin-bottom:1px;}
.nav-item:hover{background:var(--bg-3);color:var(--text-hi);}
.nav-item.active{background:var(--accent-soft);color:var(--text-hi);}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent);}
.nav-icon{width:16px;text-align:center;font-size:13.5px;opacity:.9;}
.nav-badge{margin-left:auto;font-family:var(--font-mono);font-size:10px;background:var(--bg-4);color:var(--text-dim);padding:1px 6px;border-radius:10px;}
.nav-badge.warn{background:var(--red-soft);color:var(--red);}
.sidebar-foot{padding:12px 14px;border-top:1px solid var(--border-soft);}
.kbd-hint{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-faint);background:var(--bg-2);border:1px solid var(--border-soft);border-radius:8px;padding:7px 10px;cursor:pointer;}
.kbd-hint kbd{font-family:var(--font-mono);background:var(--bg-4);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--text-dim);}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(1200px 500px at 100% -10%, rgba(124,92,255,.05), transparent);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;border-bottom:1px solid var(--border-soft);flex-shrink:0;}
.topbar-title{display:flex;flex-direction:column;gap:2px;}
.topbar-title h1{font-size:19px;}
.topbar-sub{font-size:12px;color:var(--text-dim);}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.view-scroll{flex:1;overflow-y:auto;padding:24px 26px 60px;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--bg-3);color:var(--text-hi);font-size:12.8px;font-weight:600;transition:all .12s;white-space:nowrap;}
.btn:hover{background:var(--bg-4);border-color:#3a3b40;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;box-shadow:0 4px 16px rgba(124,92,255,.25);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-danger{background:var(--red-soft);border-color:rgba(244,81,95,.3);color:var(--red);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn-ghost:hover{background:var(--bg-3);color:var(--text-hi);}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:7px;}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(1,1fr);}}
.card{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:18px;}
.card-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600;margin-bottom:10px;}
.stat-card{position:relative;overflow:hidden;}
.stat-value{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--text-hi);letter-spacing:-.02em;}
.stat-delta{font-size:11.5px;margin-top:6px;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
.stat-delta.up{color:var(--green);}
.stat-delta.down{color:var(--red);}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title:first-child{margin-top:0;}
.section-title h2{font-size:15px;}

/* ---------- Badges / pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;font-family:var(--font-mono);white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;}
.pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.pill-green{background:var(--green-soft);color:var(--green);}
.pill-red{background:var(--red-soft);color:var(--red);}
.pill-amber{background:var(--amber-soft);color:var(--amber);}
.pill-blue{background:rgba(79,140,255,.14);color:var(--accent-2);}
.pill-gray{background:var(--bg-4);color:var(--text-dim);}
.pill-cyan{background:var(--cyan-soft);color:var(--cyan);}

/* ---------- Table ---------- */
.table-wrap{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-lg);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border-soft);background:var(--bg-1);position:sticky;top:0;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .1s;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--bg-3);}
.cell-amount{font-family:var(--font-mono);font-weight:600;color:var(--text-hi);}
.cell-id{font-family:var(--font-mono);color:var(--accent-2);font-weight:600;}
.empty-state{padding:50px 20px;text-align:center;color:var(--text-faint);}

/* ---------- Filters bar ---------- */
.filters-bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.select,.text-input{background:var(--bg-3);border:1px solid var(--border);color:var(--text-hi);border-radius:8px;padding:7px 10px;font-size:12.5px;outline:none;}
.select:focus,.text-input:focus{border-color:var(--accent);}
.text-input{min-width:220px;}
.search-input{position:relative;flex:1;max-width:320px;}

/* ---------- Modal / Drawer ---------- */
.overlay-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:var(--bg-1);border-left:1px solid var(--border);z-index:61;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideIn .18s ease;}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;}
.drawer-body{padding:20px;overflow-y:auto;flex:1;}
.drawer-foot{padding:16px 20px;border-top:1px solid var(--border-soft);display:flex;gap:8px;}
.modal{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:520px;max-width:92vw;animation:popIn .15s ease;}
@keyframes popIn{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- Command palette ---------- */
.palette{width:560px;max-width:92vw;background:var(--bg-1);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;}
.palette-input{width:100%;padding:16px 18px;background:transparent;border:none;border-bottom:1px solid var(--border-soft);color:var(--text-hi);font-size:15px;outline:none;}
.palette-list{max-height:360px;overflow-y:auto;padding:6px;}
.palette-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;color:var(--text-dim);cursor:pointer;}
.palette-item.sel{background:var(--accent-soft);color:var(--text-hi);}
.palette-item .k{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}

/* ---------- Toasts ---------- */
#toast-root{position:fixed;bottom:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:8px;width:340px;}
.toast{background:var(--bg-3);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow-lg);animation:toastIn .18s ease;}
@keyframes toastIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.success{border-left-color:var(--green);}
.toast.error{border-left-color:var(--red);}
.toast.warning{border-left-color:var(--amber);}
.toast-msg{font-size:12.5px;color:var(--text-hi);flex:1;line-height:1.4;}
.toast-close{color:var(--text-faint);font-size:14px;line-height:1;}

/* ---------- Execution overlay (4-step pipeline) ---------- */
.exec-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:70;display:flex;align-items:center;justify-content:center;}
.exec-panel{width:520px;max-width:90vw;background:var(--bg-1);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:var(--shadow-lg);}
.exec-case{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:22px;}
.exec-steps{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.exec-step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;position:relative;}
.exec-step .dot{width:34px;height:34px;border-radius:50%;background:var(--bg-3);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-faint);transition:all .25s;z-index:2;}
.exec-step .lbl{font-size:10.5px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.exec-step.active .dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px rgba(124,92,255,.12);}
.exec-step.active .lbl{color:var(--text-hi);}
.exec-step.done .dot{background:var(--green-soft);border-color:var(--green);color:var(--green);}
.exec-step.done .lbl{color:var(--green);}
.exec-line{position:absolute;top:17px;left:50%;width:100%;height:1.5px;background:var(--border);z-index:1;}
.exec-step.done .exec-line{background:var(--green);}
.exec-step:last-child .exec-line{display:none;}
.exec-msg{text-align:center;font-size:12.5px;color:var(--text-dim);min-height:18px;font-family:var(--font-mono);}

/* ---------- Batch terminal ---------- */
.terminal{background:#050505;border:1px solid var(--border-soft);border-radius:var(--radius-lg);font-family:var(--font-mono);font-size:12px;padding:14px 16px;height:340px;overflow-y:auto;display:flex;flex-direction:column-reverse;}
.term-line{padding:2px 0;color:var(--text-dim);white-space:pre-wrap;word-break:break-word;}
.term-line .t{color:var(--text-faint);}
.term-line.ok{color:var(--green);}
.term-line.fail{color:var(--red);}
.term-line.esc{color:var(--amber);}
.term-line.skip{color:var(--text-faint);}
.term-line.info{color:var(--accent-2);}

/* ---------- Progress bar ---------- */
.progress-bar{height:5px;background:var(--bg-4);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s ease;}

/* ---------- Policy check list ---------- */
.policy-check{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--border-soft);}
.policy-check:last-child{border-bottom:none;}
.policy-check .ic{width:18px;text-align:center;}
.policy-check.pass .ic{color:var(--green);}
.policy-check.fail .ic{color:var(--red);}
.policy-check .lbl{color:var(--text-dim);flex:1;}
.policy-check .val{font-family:var(--font-mono);color:var(--text-hi);font-size:11.5px;}

/* ---------- Playbook cards ---------- */
.playbook-card{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:10px;}
.playbook-head{display:flex;align-items:center;gap:10px;}
.playbook-num{width:30px;height:30px;border-radius:8px;background:var(--bg-4);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;color:var(--accent-2);font-size:13px;flex-shrink:0;}
.playbook-desc{font-size:12.5px;color:var(--text-dim);line-height:1.55;flex:1;}
.playbook-foot{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--text-faint);}

/* ---------- Voice UI ---------- */
.voice-layout{display:grid;grid-template-columns:320px 1fr;gap:18px;}
.voice-panel{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.mic-ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:var(--bg-3);border:2px solid var(--border);transition:all .2s;}
.mic-ring .core{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--bg-4);}
.mic-ring.idle{border-color:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.4);}
.mic-ring.listening{border-color:var(--red);animation:pulseRed 1.1s infinite;}
.mic-ring.speaking{border-color:var(--accent);animation:pulsePurple 1.1s infinite;}
.mic-ring.processing{border-color:var(--amber);}
@keyframes pulseRed{0%{box-shadow:0 0 0 0 rgba(244,81,95,.45)}70%{box-shadow:0 0 0 16px rgba(244,81,95,0)}100%{box-shadow:0 0 0 0 rgba(244,81,95,0)}}
@keyframes pulsePurple{0%{box-shadow:0 0 0 0 rgba(124,92,255,.45)}70%{box-shadow:0 0 0 16px rgba(124,92,255,0)}100%{box-shadow:0 0 0 0 rgba(124,92,255,0)}}
.mic-state-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);}
.call-timer{font-family:var(--font-mono);font-size:22px;color:var(--text-hi);font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.chip{background:var(--bg-3);border:1px solid var(--border);color:var(--text-dim);padding:5px 10px;border-radius:20px;font-size:11.5px;}
.chip:hover{color:var(--text-hi);border-color:var(--accent);}
.voice-chat{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-lg);display:flex;flex-direction:column;height:560px;}
.voice-chat-head{padding:14px 18px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;}
.voice-chat-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
.bubble{max-width:78%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;}
.bubble.agent{align-self:flex-start;background:var(--bg-3);border:1px solid var(--border-soft);border-bottom-left-radius:4px;}
.bubble.user{align-self:flex-end;background:var(--accent-soft);border:1px solid rgba(124,92,255,.25);border-bottom-right-radius:4px;color:var(--text-hi);}
.bubble .meta{font-size:9.5px;color:var(--text-faint);margin-top:4px;font-family:var(--font-mono);}
.interim{align-self:flex-end;font-size:12px;color:var(--text-faint);font-style:italic;padding:0 4px;}
.voice-chat-foot{padding:12px 16px;border-top:1px solid var(--border-soft);display:flex;gap:8px;}
.voice-chat-foot input{flex:1;background:var(--bg-3);border:1px solid var(--border);border-radius:9px;padding:9px 12px;outline:none;font-size:12.5px;}

/* ---------- Audit ---------- */
.audit-row{display:grid;grid-template-columns:150px 90px 110px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:12px;align-items:center;}
.audit-row:hover{background:var(--bg-3);}
.audit-row .ts{font-family:var(--font-mono);color:var(--text-faint);font-size:11px;}
.audit-row .msg{color:var(--text-dim);}
.audit-row .msg b{color:var(--text-hi);font-weight:600;}

/* ---------- Settings ---------- */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border-soft);gap:20px;}
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{font-size:13px;color:var(--text-hi);font-weight:500;}
.settings-row .hint{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.switch{width:40px;height:22px;border-radius:20px;background:var(--bg-4);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;}
.switch.on{background:var(--accent);border-color:var(--accent);}
.switch .knob{position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;}
.switch.on .knob{transform:translateX(18px);}
.num-input{width:110px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-family:var(--font-mono);color:var(--text-hi);text-align:right;}

/* ---------- Misc ---------- */
.divider{height:1px;background:var(--border-soft);margin:16px 0;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--text-faint);}
.progress-mini{display:flex;align-items:center;gap:8px;}
.progress-mini .progress-bar{flex:1;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

<script>
'use strict';
/* =========================================================================
   RecoverAI — Autonomous Revenue Recovery Agent
   Single-file, zero-backend, zero-cost demo for Razorpay Track 03.
   ========================================================================= */

/* ---------------------------- Utilities ---------------------------- */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid = (p='ID') => p + '-' + Math.random().toString(36).slice(2,8).toUpperCase();
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const pick = (arr) => arr[randInt(0, arr.length-1)];
const fmtINR = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const escapeHtml = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nowTs(){ return Date.now(); }
function fmtTime(ts){
  const d = new Date(ts);
  return d.toTimeString().slice(0,8);
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(ts){ return fmtDate(ts) + ' ' + fmtTime(ts); }
function currentHour(){ return new Date().getHours(); }

/* ---------------------------- Constants ---------------------------- */
const PLAYBOOK_META = {
  payment_degradation: {name:'Payment Degradation Scan', icon:'⚡', num:'01', color:'blue',
    desc:'Detects gateway timeouts and auth declines in real time, then reroutes traffic to a backup PSP or intelligently delays the retry window.'},
  checkout_dropoff: {name:'Checkout Drop-off Recovery', icon:'🛒', num:'02', color:'cyan',
    desc:'Targets abandoned carts and sends a smart recovery link tailored to the exact step where the customer dropped off.'},
  subscription_dunning: {name:'Failed-Subscription Recovery', icon:'🔁', num:'03', color:'amber',
    desc:'Runs a smart retry ladder (T+0, T+2d, T+5d) for insufficient-funds and UPI failures on recurring subscriptions.'},
  b2b_receivables: {name:'B2B Receivables Chaser', icon:'📄', num:'04', color:'red',
    desc:'Walks aging buckets (30/60/90 days) and escalates tone and channel automatically as an invoice ages.'},
  mandate_retry: {name:'Mandate Retry Sequencer', icon:'🔐', num:'05', color:'green',
    desc:'Sequences UPI AutoPay / eNACH retries into intelligent windows to maximize authorization success.'},
  voice_recovery: {name:'Hinglish Voice Recovery', icon:'🎙️', num:'06', color:'blue',
    desc:'An AI voice agent calls high-risk customers, understands Hindi-English code-switching, and negotiates a promise-to-pay live.'},
  promise_to_pay: {name:'Promise-to-Pay Tracker', icon:'✅', num:'07', color:'cyan',
    desc:'Captures verbal/written commitments, tracks due dates, and automatically marks them fulfilled or broken.'}
};
const FAILURE_REASONS = {
  payment_degradation: ['GATEWAY_TIMEOUT','AUTH_DECLINED','NETWORK_ERROR','ISSUER_UNAVAILABLE'],
  checkout_dropoff: ['ABANDONED_AT_CART','ABANDONED_AT_ADDRESS','ABANDONED_AT_PAYMENT','ABANDONED_AT_OTP'],
  subscription_dunning: ['INSUFFICIENT_FUNDS','UPI_MANDATE_FAIL','CARD_EXPIRED','ISSUER_DECLINE'],
  b2b_receivables: ['INVOICE_OVERDUE'],
  mandate_retry: ['MANDATE_AUTH_FAIL','MANDATE_EXPIRED_WINDOW'],
  voice_recovery: ['HIGH_RISK_SILENT','REPEATED_SOFT_DECLINE'],
  promise_to_pay: ['AWAITING_COMMITMENT']
};
const DROPOFF_STEPS = ['cart','address','payment_method','otp'];
const GATEWAYS = ['razorpay_primary','razorpay_backup','upi_switch'];
const CUSTOMER_POOL = [
  ['Rohan Mehta','+91 98200 11223'],['Ananya Iyer','+91 90040 55621'],['Vikram Shah','+91 99870 44120'],
  ['Priya Nair','+91 97650 88132'],['Karthik Reddy','+91 63456 90211'],['Sneha Kulkarni','+91 88997 21341'],
  ['Arjun Malhotra','+91 70123 45678'],['Divya Krishnan','+91 96432 10987'],['Farhan Sheikh','+91 81234 56789'],
  ['Meera Pillai','+91 74109 87654'],['Aditya Verma','+91 93456 78012'],['Lakshmi Rao','+91 89765 43210'],
  ['Nikhil Bose','+91 95432 10678'],['Kavya Menon','+91 82109 87345'],['Suresh Babu','+91 76543 21098'],
  ['Ritu Chawla','+91 91234 56780'],['Manish Agarwal','+91 87654 32109'],['Pooja Desai','+91 90876 54321'],
  ['Rajesh Kumar','+91 99001 12233'],['Sanya Kapoor','+91 88112 23344']
];
const COMPANY_POOL = ['Vertex Textiles Pvt Ltd','Bluepeak Logistics','Northstar Traders','Orbit Manufacturing','Solace Retail Group'];

/* ---------------------------- Policy Engine ---------------------------- */
const Policy = {
  autoCap: 25000,
  maxRetries: 3,
  confidenceThreshold: 0.75,
  quietStart: 22,
  quietEnd: 8,
  simFailure: false,

  isQuietHours(){
    const h = currentHour();
    if (this.quietStart > this.quietEnd) return (h >= this.quietStart || h < this.quietEnd);
    return (h >= this.quietStart && h < this.quietEnd);
  },

  /** Returns {allowed, checks:[{label,pass,val}], reason} */
  evaluate(kase, action){
    const checks = [];
    let allowed = true;
    let reason = '';

    const capOk = kase.amount <= this.autoCap;
    checks.push({label:'Auto-execution cap', pass:capOk, val: fmtINR(kase.amount)+' ≤ '+fmtINR(this.autoCap)});
    if (!capOk){ allowed = false; reason = 'Amount exceeds auto-execution cap of '+fmtINR(this.autoCap); }

    const retryOk = kase.attempts < this.maxRetries;
    checks.push({label:'Stopping rule (retries)', pass:retryOk, val: kase.attempts+' / '+this.maxRetries+' used'});
    if (!retryOk){ allowed = false; reason = reason || ('Max retry attempts ('+this.maxRetries+') exhausted'); }

    const confOk = kase.confidence >= this.confidenceThreshold;
    checks.push({label:'Confidence threshold', pass:confOk, val: Math.round(kase.confidence*100)+'% ≥ '+Math.round(this.confidenceThreshold*100)+'%'});
    if (!confOk){ allowed = false; reason = reason || ('Confidence below '+Math.round(this.confidenceThreshold*100)+'% threshold'); }

    const isVelocityChannel = (action === 'voice_call' || action === 'sms');
    const quiet = this.isQuietHours();
    const velocityOk = !(isVelocityChannel && quiet);
    checks.push({label:'Velocity / quiet hours', pass:velocityOk, val: quiet ? 'Quiet hours active ('+this.quietStart+':00–'+this.quietEnd+':00)' : 'Outside quiet hours'});
    if (!velocityOk){ allowed = false; reason = reason || 'Quiet hours block outbound voice/SMS (22:00–08:00)'; }

    if (this.simFailure){
      checks.push({label:'Gateway health', pass:false, val:'SIMULATED OUTAGE ARMED'});
      allowed = false;
      reason = reason || 'Gateway failure simulation is armed';
    }

    return {allowed, checks, reason};
  }
};

/* ---------------------------- Global State ---------------------------- */
const S = {
  cases: [],
  audit: [],
  promises: [],
  view: 'overview',
  batch: {running:false, processed:0, total:0, recovered:0, recoveredAmt:0, escalated:0, skipped:0, failed:0, log:[]},
  voice: {status:'idle', transcript:'', interim:'', history:[], activeCaseId:null, callSeconds:0, timerHandle:null, recognizer:null},
  filters: {casesType:'all', casesStatus:'all', casesQuery:'', auditQuery:'', auditType:'all'},
  ui: {paletteOpen:false, drawerCaseId:null, execOverlay:null},
};

const STORAGE_KEY = 'recoverai_state_v1';

function persist(){
  try{
    const payload = {
      cases: S.cases, audit: S.audit, promises: S.promises,
      policy: {autoCap:Policy.autoCap, maxRetries:Policy.maxRetries, confidenceThreshold:Policy.confidenceThreshold,
               quietStart:Policy.quietStart, quietEnd:Policy.quietEnd, simFailure:Policy.simFailure}
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  }catch(e){ /* storage unavailable — demo continues in-memory */ }
}
function restore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const p = JSON.parse(raw);
    if (!p.cases || !p.cases.length) return false;
    S.cases = p.cases; S.audit = p.audit || []; S.promises = p.promises || [];
    if (p.policy){ Object.assign(Policy, p.policy); }
    return true;
  }catch(e){ return false; }
}

/* ---------------------------- Seed Data Generator ---------------------------- */
function genCase(type, idx){
  const [name, phone] = pick(CUSTOMER_POOL);
  const reason = pick(FAILURE_REASONS[type]);
  const createdAt = nowTs() - randInt(1, 20) * 3600*1000 - randInt(0,59)*60000;
  const base = {
    id: 'RC-' + (1000 + idx),
    type, customer: {name, phone, email: name.toLowerCase().replace(/\s+/g,'.') + '@example.com'},
    failureReason: reason,
    gateway: pick(GATEWAYS),
    attempts: randInt(0,2),
    maxAttempts: Policy.maxRetries,
    confidence: +rand(0.55, 0.97).toFixed(2),
    status: 'open',
    createdAt,
    lastAttemptAt: null,
    history: [],
  };
  if (type === 'payment_degradation'){
    base.amount = randInt(400, 22000);
  } else if (type === 'checkout_dropoff'){
    base.amount = randInt(300, 15000);
    base.dropoffStep = pick(DROPOFF_STEPS);
  } else if (type === 'subscription_dunning'){
    base.amount = pick([499, 999, 1499, 2499, 4999]);
    base.planName = pick(['Pro Monthly','Team Annual','Starter Plus','Business Growth']);
  } else if (type === 'b2b_receivables'){
    base.amount = randInt(18000, 240000);
    base.customer.name = pick(COMPANY_POOL);
    base.customer.email = 'accounts@' + base.customer.name.toLowerCase().replace(/[^a-z]/g,'').slice(0,10) + '.com';
    base.agingDays = pick([31, 42, 58, 65, 91, 104]);
    base.invoiceId = 'INV-' + randInt(20000,29999);
  } else if (type === 'mandate_retry'){
    base.amount = pick([199, 349, 599, 999, 1999]);
    base.mandateType = pick(['UPI_AUTOPAY','ENACH']);
  } else if (type === 'voice_recovery'){
    base.amount = randInt(800, 24000);
    base.riskScore = +rand(0.6,0.95).toFixed(2);
  } else if (type === 'promise_to_pay'){
    base.amount = randInt(500, 18000);
    base.promisedDate = nowTs() - randInt(0,3)*86400000;
    base.dueDate = nowTs() + randInt(-1, 4) * 86400000;
  }
  return base;
}

function seedData(){
  const types = ['payment_degradation','checkout_dropoff','subscription_dunning','b2b_receivables','mandate_retry','voice_recovery','promise_to_pay'];
  const cases = [];
  let idx = 1;
  // ensure at least 2-3 of every type, total ~20
  const counts = {payment_degradation:3, checkout_dropoff:3, subscription_dunning:3, b2b_receivables:3, mandate_retry:3, voice_recovery:3, promise_to_pay:2};
  types.forEach(t => {
    for (let i=0;i<counts[t];i++){ cases.push(genCase(t, idx++)); }
  });
  S.cases = cases;
  S.audit = [];
  S.promises = [];

  // seed promise records for promise_to_pay cases + a couple already resolved for realism
  S.cases.filter(c=>c.type==='promise_to_pay').forEach(c=>{
    S.promises.push({
      id: uid('PR'), caseId: c.id, customerName: c.customer.name, amount: c.amount,
      promisedDate: c.promisedDate, dueDate: c.dueDate, status: 'pending', channel: pick(['voice','sms','whatsapp'])
    });
  });

  logAudit({type:'system', caseId:null, message:'Demo data seeded: <b>'+S.cases.length+' cases</b> generated across 7 playbooks.'});
  persist();
}

/* ---------------------------- Audit Trail ---------------------------- */
function logAudit(entry){
  const row = {
    id: uid('AU'),
    ts: nowTs(),
    type: entry.type || 'system',       // policy | execution | escalation | voice | promise | system
    caseId: entry.caseId || null,
    message: entry.message || '',
    meta: entry.meta || null,
  };
  S.audit.unshift(row);
  if (S.audit.length > 2000) S.audit.length = 2000;
  return row;
}

/* ---------------------------- Toasts ---------------------------- */
function toast(message, type='info', ms=4200){
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = {success:'✅', error:'⛔', warning:'⚠️', info:'ℹ️'}[type] || 'ℹ️';
  el.innerHTML = '<div>'+icon+'</div><div class="toast-msg">'+message+'</div><div class="toast-close" data-action="dismiss-toast">✕</div>';
  root.appendChild(el);
  const kill = () => { if(el.parentNode){ el.style.transition='opacity .2s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 200);} };
  el.querySelector('.toast-close').addEventListener('click', kill);
  setTimeout(kill, ms);
}

/* ---------------------------- Playbooks ---------------------------- */
const Playbooks = {
  payment_degradation: {
    decide(kase){
      const action = kase.gateway === 'razorpay_primary' ? 'reroute_backup_psp' : 'delay_retry';
      const label = action === 'reroute_backup_psp' ? 'Reroute to backup PSP' : 'Delay retry by 15 minutes';
      return {action, label};
    },
    execute(kase, decision){
      const successProb = clamp(kase.confidence - kase.attempts*0.08, 0.05, 0.95);
      const success = Math.random() < successProb;
      return success
        ? {outcome:'RECOVERED', amountRecovered: kase.amount, note: decision.label + ' → authorization succeeded'}
        : {outcome:'FAILED', amountRecovered:0, note: decision.label + ' → issuer declined again'};
    }
  },
  checkout_dropoff: {
    decide(kase){
      const stepWeight = {cart:0.25, address:0.4, payment_method:0.6, otp:0.75}[kase.dropoffStep] || 0.4;
      const channel = kase.amount > 5000 ? 'whatsapp' : 'sms';
      return {action:'send_recovery_link', label:'Send smart recovery link ('+kase.dropoffStep+' → '+channel+')', channel, stepWeight};
    },
    execute(kase, decision){
      const success = Math.random() < decision.stepWeight;
      return success
        ? {outcome:'RECOVERED', amountRecovered:kase.amount, note:'Customer completed checkout via recovery link'}
        : {outcome:'FAILED', amountRecovered:0, note:'Recovery link sent, no conversion yet'};
    }
  },
  subscription_dunning: {
    decide(kase){
      const ladder = ['Immediate retry (T+0)', 'Retry + reminder email (T+2d)', 'Final retry + escalation warning (T+5d)'];
      const label = ladder[clamp(kase.attempts,0,2)];
      return {action:'dunning_retry', label};
    },
    execute(kase, decision){
      const successProb = clamp(0.55 - kase.attempts*0.12, 0.1, 0.8);
      const success = Math.random() < successProb;
      return success
        ? {outcome:'RECOVERED', amountRecovered:kase.amount, note: decision.label + ' → card charged successfully'}
        : {outcome:'FAILED', amountRecovered:0, note: decision.label + ' → insufficient funds'};
    }
  },
  b2b_receivables: {
    decide(kase){
      let tone, channel;
      if (kase.agingDays >= 90){ tone='Formal notice'; channel='legal-escalation'; }
      else if (kase.agingDays >= 60){ tone='Firm reminder'; channel='email+call'; }
      else { tone='Polite reminder'; channel='email'; }
      return {action:'chase_receivable', label: tone+' via '+channel+' ('+kase.agingDays+'d overdue)', channel};
    },
    execute(kase, decision){
      if (decision.channel === 'legal-escalation'){
        return {outcome:'ESCALATED', amountRecovered:0, note:'90+ day invoice — routed to collections / human review'};
      }
      const successProb = clamp(0.5 - kase.agingDays/300, 0.08, 0.6);
      const success = Math.random() < successProb;
      return success
        ? {outcome:'RECOVERED', amountRecovered:kase.amount, note: decision.label + ' → payment received'}
        : {outcome:'FAILED', amountRecovered:0, note: decision.label + ' → no response yet'};
    }
  },
  mandate_retry: {
    decide(kase){
      const window = kase.mandateType === 'UPI_AUTOPAY' ? 'next-day 10:00 AM window' : 'next eNACH clearing cycle';
      return {action:'schedule_mandate_retry', label:'Schedule retry — '+window};
    },
    execute(kase, decision){
      const successProb = clamp(0.6 - kase.attempts*0.15, 0.1, 0.85);
      const success = Math.random() < successProb;
      return success
        ? {outcome:'RECOVERED', amountRecovered:kase.amount, note: decision.label + ' → mandate authorized'}
        : {outcome:'FAILED', amountRecovered:0, note: decision.label + ' → mandate auth failed'};
    }
  },
  voice_recovery: {
    decide(kase){
      return {action:'voice_call', label:'Outbound Hinglish voice call to '+kase.customer.name};
    },
    execute(kase, decision){
      if (Policy.isQuietHours()){
        return {outcome:'SKIPPED', amountRecovered:0, note:'Blocked — quiet hours (22:00–08:00)'};
      }
      const roll = Math.random();
      if (roll < kase.riskScore * 0.5){
        return {outcome:'PROMISED', amountRecovered:0, note:'Customer verbally committed — promise-to-pay captured'};
      } else if (roll < 0.85){
        return {outcome:'FAILED', amountRecovered:0, note:'No answer / call not conclusive'};
      }
      return {outcome:'RECOVERED', amountRecovered:kase.amount, note:'Customer paid live during call via link'};
    }
  },
  promise_to_pay: {
    decide(kase){
      return {action:'check_promise', label:'Check commitment status'};
    },
    execute(kase, decision){
      const promise = S.promises.find(p => p.caseId === kase.id);
      if (!promise) return {outcome:'SKIPPED', amountRecovered:0, note:'No linked promise record'};
      if (nowTs() < promise.dueDate) return {outcome:'SKIPPED', amountRecovered:0, note:'Due date not yet reached'};
      const fulfilled = Math.random() < 0.65;
      if (fulfilled){
        promise.status = 'fulfilled';
        return {outcome:'RECOVERED', amountRecovered:kase.amount, note:'Promise fulfilled — payment received on time'};
      }
      promise.status = 'broken';
      return {outcome:'ESCALATED', amountRecovered:0, note:'Promise broken — re-entering dunning ladder'};
    }
  }
};

const ACTION_BY_TYPE = {
  payment_degradation:'gateway_retry', checkout_dropoff:'sms', subscription_dunning:'gateway_retry',
  b2b_receivables:'email', mandate_retry:'gateway_retry', voice_recovery:'voice_call', promise_to_pay:'check'
};

/** Runs a single case through its playbook with full policy gating. Returns result summary. Mutates state + audit. */
function processCase(kase){
  const pb = Playbooks[kase.type];
  const action = ACTION_BY_TYPE[kase.type];
  const decision = pb.decide(kase);
  const evalResult = Policy.evaluate(kase, action);

  logAudit({type:'policy', caseId:kase.id, message:'Policy check for <b>'+kase.id+'</b>: '+(evalResult.allowed?'PASS':'BLOCKED — '+evalResult.reason), meta:evalResult.checks});

  if (!evalResult.allowed){
    kase.status = 'escalated';
    kase.lastAttemptAt = nowTs();
    kase.history.push({ts:nowTs(), action:'policy_block', note:evalResult.reason});
    logAudit({type:'escalation', caseId:kase.id, message:'<b>'+kase.id+'</b> escalated to human review — '+evalResult.reason});
    return {outcome:'ESCALATED', amountRecovered:0, note: evalResult.reason, decision};
  }

  const result = pb.execute(kase, decision);
  kase.attempts += 1;
  kase.lastAttemptAt = nowTs();
  kase.history.push({ts:nowTs(), action:decision.label, note:result.note, outcome:result.outcome});

  if (result.outcome === 'RECOVERED'){
    kase.status = 'recovered';
  } else if (result.outcome === 'PROMISED'){
    kase.status = 'promise_pending';
    if (!S.promises.find(p=>p.caseId===kase.id)){
      S.promises.push({id:uid('PR'), caseId:kase.id, customerName:kase.customer.name, amount:kase.amount,
        promisedDate:nowTs(), dueDate: nowTs()+2*86400000, status:'pending', channel:'voice'});
    }
  } else if (result.outcome === 'ESCALATED'){
    kase.status = 'escalated';
  } else if (result.outcome === 'SKIPPED'){
    // status unchanged, remains open for next batch window
  } else { // FAILED
    kase.status = kase.attempts >= kase.maxAttempts ? 'escalated' : 'open';
    if (kase.status === 'escalated'){
      logAudit({type:'escalation', caseId:kase.id, message:'<b>'+kase.id+'</b> escalated — max retry attempts exhausted'});
    }
  }

  logAudit({type:'execution', caseId:kase.id, message:'<b>'+kase.id+'</b> — '+decision.label+' → <b>'+result.outcome+'</b>'+(result.amountRecovered?' ('+fmtINR(result.amountRecovered)+')':'')});
  return Object.assign({decision}, result);
}

function eligibleCases(){
  return S.cases.filter(c => c.status === 'open');
}

/* ---------------------------- Batch Engine ---------------------------- */
async function runBatch(){
  if (S.batch.running) return;
  const targets = eligibleCases();
  if (!targets.length){ toast('No eligible open cases to process.', 'warning'); return; }

  S.batch = {running:true, processed:0, total:targets.length, recovered:0, recoveredAmt:0, escalated:0, skipped:0, failed:0, log:[]};
  render();
  termPush('info', 'Batch run started — ' + targets.length + ' eligible cases queued.');
  logAudit({type:'system', caseId:null, message:'Batch execution started across <b>'+targets.length+'</b> eligible cases.'});

  for (const kase of targets){
    if (!S.batch.running) break; // allow future cancel hook
    await showExecOverlay(kase);
    const result = processCase(kase);
    S.batch.processed++;
    if (result.outcome === 'RECOVERED'){ S.batch.recovered++; S.batch.recoveredAmt += result.amountRecovered; termPush('ok', 'RECOVERED: '+kase.id+' — '+fmtINR(result.amountRecovered)+' ('+kase.customer.name+')'); }
    else if (result.outcome === 'ESCALATED'){ S.batch.escalated++; termPush('esc', 'ESCALATED: '+kase.id+' — '+result.note); }
    else if (result.outcome === 'SKIPPED'){ S.batch.skipped++; termPush('skip', 'SKIPPED: '+kase.id+' — '+result.note); }
    else if (result.outcome === 'PROMISED'){ S.batch.recovered += 0; termPush('info', 'PROMISE CAPTURED: '+kase.id+' — '+kase.customer.name); }
    else { S.batch.failed++; termPush('fail', 'FAILED: '+kase.id+' — '+result.note); }
    render();
    await sleep(140);
  }

  hideExecOverlay();
  S.batch.running = false;
  persist();
  render();
  toast('Batch complete — '+S.batch.recovered+' recovered, '+fmtINR(S.batch.recoveredAmt)+' total.', 'success', 6000);
  logAudit({type:'system', caseId:null, message:'Batch execution finished. Recovered '+fmtINR(S.batch.recoveredAmt)+' across '+S.batch.processed+' cases ('+S.batch.escalated+' escalated, '+S.batch.skipped+' skipped, '+S.batch.failed+' failed).'});
}
function termPush(cls, msg){
  S.batch.log.unshift({cls, msg, ts:nowTs()});
  if (S.batch.log.length > 400) S.batch.log.length = 400;
}

/* ---------------------------- Execution Overlay (4-step pipeline) ---------------------------- */
async function showExecOverlay(kase){
  const root = $('#overlay-root');
  const steps = ['Detect','Diagnose','Decide','Execute'];
  root.innerHTML =
    '<div class="exec-overlay"><div class="exec-panel">'+
      '<div class="exec-case">Processing <b class="mono" style="color:var(--text-hi)">'+kase.id+'</b> — '+escapeHtml(kase.customer.name)+' — '+fmtINR(kase.amount)+'</div>'+

const VOICE_INTENTS = [
  {intent:'PROMISE_TO_PAY', kw:['haan bilkul','payment kar dunga','kar dunga','pay kar dunga','main pay','i will pay','will pay','pay kardunga','katuren','kattutha','kodthini','kodthene','settle pannuven','pannuven','definitely pay','sure i will','haan pay','ok pay']},
  {intent:'NEED_TIME', kw:['thoda baad','baad mein','abhi nahi','salary nahi aaya','next week','agle hafte','kuch din','thoda time','naalai','konjam time','konchem time',' willbe late','later','not now']},
  {intent:'ALREADY_PAID', kw:['already paid','maine pay kar diya','kar diya tha','paid already','payment ho gaya','ho chuka','seri pannitten','already kattesa']},
  {intent:'DISPUTE', kw:['galat charge','wrong charge','not my transaction','maine nahi kiya','dispute','fraud','galat hai','yeh sahi nahi']},
  {intent:'CANNOT_PAY', kw:['nahi kar sakta','can\'t pay','cannot pay','no money','paisa nahi hai','affordable nahi','mushkil hai']},
  {intent:'WRONG_NUMBER', kw:['wrong number','galat number','who is this','yeh number','not me']},
  {intent:'ANGRY', kw:['stop calling','harass','pareshaan','baar baar','irritat','angry','gussa']},
  {intent:'DECLINE', kw:['nahi','no ','nope','never','mat karo']},
  {intent:'GREETING', kw:['hello','hi ','namaste','vanakkam','namaskar']},
  {intent:'GOODBYE', kw:['bye','thik hai bye','dhanyavad','thank you','ok bye','theek hai']},
];
function detectIntent(text){
  const t = (' '+text.toLowerCase()+' ');
  let best = {intent:'UNCLEAR', score:0};
  for (const row of VOICE_INTENTS){
    let score = 0;
    for (const kw of row.kw){ if (t.indexOf(kw.toLowerCase()) !== -1) score++; }
    if (score > best.score) best = {intent: row.intent, score};
  }
  return best.intent;
}

function agentReply(intent){ return pick(VOICE_RESPONSES[intent] || VOICE_RESPONSES.UNCLEAR); }

let recognizer = null;
function getRecognizer(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  if (recognizer) return recognizer;
  recognizer = new SR();
  recognizer.lang = 'hi-IN';
  recognizer.continuous = false;
  recognizer.interimResults = true;
  recognizer.maxAlternatives = 1;
  recognizer.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    S.voice.interim = interim;
    if (final){ handleVoiceUserUtterance(final.trim()); }
    else { renderVoiceInterim(); }
  };
  recognizer.onerror = () => { S.voice.status = 'idle'; S.voice.interim=''; render(); };
  recognizer.onend = () => {
    if (S.voice.status === 'listening'){ S.voice.status = 'idle'; S.voice.interim=''; render(); }
  };
  return recognizer;
}
function startVoiceCall(caseId){
  const kase = S.cases.find(c=>c.id===caseId) || null;
  S.voice.activeCaseId = caseId || null;
  S.voice.status = 'idle';
  S.voice.history = [];
  S.voice.callSeconds = 0;
  clearInterval(S.voice.timerHandle);
  S.voice.timerHandle = setInterval(()=>{ S.voice.callSeconds++; renderVoiceTimer(); }, 1000);
  const opener = agentReply('GREETING');
  pushVoiceBubble('agent', opener);
  speak(opener);
  logAudit({type:'voice', caseId: caseId||null, message:'Voice call started'+(kase?' with <b>'+kase.customer.name+'</b>':'')+'.'});
  render();
}
function endVoiceCall(){
  clearInterval(S.voice.timerHandle);
  S.voice.status = 'idle';
  try{ if (recognizer) recognizer.abort(); }catch(e){}
  logAudit({type:'voice', caseId: S.voice.activeCaseId, message:'Voice call ended. Duration '+S.voice.callSeconds+'s.'});
  toast('Call ended.', 'info');
  S.voice.activeCaseId = null;
  render();
}
function pushVoiceBubble(who, text){
  S.voice.history.push({who, text, ts: nowTs()});
  renderVoiceChat();
}
function handleVoiceUserUtterance(text){
  S.voice.interim = '';
  pushVoiceBubble('user', text);
  const intent = detectIntent(text);
  S.voice.status = 'processing';
  render();
  setTimeout(() => {
    const reply = agentReply(intent);
    S.voice.status = 'speaking';
    render();
    pushVoiceBubble('agent', reply);
    speak(reply, () => { S.voice.status = 'idle'; render(); });

    if (intent === 'PROMISE_TO_PAY' && S.voice.activeCaseId){
      const kase = S.cases.find(c=>c.id===S.voice.activeCaseId);
      if (kase && kase.status !== 'recovered'){
        kase.status = 'promise_pending';
        kase.history.push({ts:nowTs(), action:'voice_promise', note:'Promise captured via voice call: "'+text+'"'});
        if (!S.promises.find(p=>p.caseId===kase.id)){
          S.promises.push({id:uid('PR'), caseId:kase.id, customerName:kase.customer.name, amount:kase.amount,
            promisedDate:nowTs(), dueDate: nowTs()+2*86400000, status:'pending', channel:'voice'});
        }
        logAudit({type:'promise', caseId:kase.id, message:'Promise-to-pay captured via voice for <b>'+kase.id+'</b> — due in 2 days.'});
        persist();
        toast('Promise-to-pay captured for '+kase.id+'.', 'success');
      }
    } else if (intent === 'DISPUTE' && S.voice.activeCaseId){
      logAudit({type:'voice', caseId:S.voice.activeCaseId, message:'Dispute raised on call — forwarded to human review.'});
    }
  }, 500);
}
function speak(text, onend){
  S.voice.status = 'speaking';
  if (!window.speechSynthesis){ if(onend) setTimeout(onend, 700); return; }
  try{
    const u = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();
    const inVoice = voices.find(v => /en-IN|hi-IN/i.test(v.lang));
    if (inVoice) u.voice = inVoice;
    u.rate = 1.0; u.pitch = 1.05; u.lang = inVoice ? inVoice.lang : 'en-US';
    u.onend = () => { if(onend) onend(); };
    u.onerror = () => { if(onend) onend(); };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){ if(onend) setTimeout(onend, 700); }
}
function toggleListening(){
  const rec = getRecognizer();
  if (!rec){ toast('SpeechRecognition not supported in this browser. Use quick-reply chips or type instead.', 'warning'); return; }
  if (S.voice.status === 'listening'){
    rec.stop(); S.voice.status = 'idle'; render(); return;
  }
  try{
    S.voice.status = 'listening'; S.voice.interim=''; render();
    rec.start();
  }catch(e){ /* already started */ }
}

/* ============================================================================
   EVENT DELEGATION
   ============================================================================ */
function bindGlobalStaticListeners(){ /* placeholder: all binding is delegated at document level, see bottom */ }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.getAttribute('data-action');

  switch(action){
    case 'nav': navigate(el.getAttribute('data-view')); break;
    case 'open-palette': openPalette(); break;
    case 'close-palette':
      // The overlay-bg wraps the palette panel; only close on a true background click,
      // not one that bubbled up from inside the panel to this ancestor via closest().
      if (e.target.closest('.palette')) break;
      closePalette();
      break;
    case 'dismiss-toast': break; // handled inline
    case 'run-batch': runBatch(); break;
    case 'open-case': S.ui.drawerCaseId = el.getAttribute('data-id'); render(); break;
    case 'close-drawer':
      if (e.target.closest('.drawer')) break; // same rationale as close-palette above
      S.ui.drawerCaseId = null; render();
      break;
    case 'process-single': {
      const kase = S.cases.find(c=>c.id===el.getAttribute('data-id'));
      if (kase){ (async()=>{ await showExecOverlay(kase); processCase(kase); hideExecOverlay(); persist(); render(); toast('Processed '+kase.id+'.', 'info'); })(); }
      break;
    }
    case 'voice-from-drawer': S.ui.drawerCaseId=null; navigate('voice'); startVoiceCall(el.getAttribute('data-id')); break;
    case 'filter-and-go': S.filters.casesType = el.getAttribute('data-type'); S.filters.casesStatus='all'; navigate('cases'); break;
    case 'export-audit': exportAudit(); break;
    case 'reset-demo': if(confirm('Reset all demo data? This clears cases, promises, and audit history.')) resetDemo(); break;
    case 'toggle-sim': Policy.simFailure = !Policy.simFailure; persist(); toast('Failure simulation '+(Policy.simFailure?'ARMED':'disarmed')+'.', Policy.simFailure?'warning':'success'); render(); break;
    case 'start-call': navigate('voice'); startVoiceCall(el.getAttribute('data-id')); break;
    case 'end-call': endVoiceCall(); break;
    case 'toggle-mic': toggleListening(); break;
    case 'quick-reply': if (S.voice.activeCaseId) handleVoiceUserUtterance(el.getAttribute('data-text')); break;
    case 'send-typed': {
      const inp = $('#voice-text-input');
      if (inp && inp.value.trim() && S.voice.activeCaseId){ handleVoiceUserUtterance(inp.value.trim()); inp.value=''; }
      break;
    }
    case 'promise-fulfill': {
      const p = S.promises.find(x=>x.id===el.getAttribute('data-id'));
      if (p){ p.status='fulfilled'; const kase=S.cases.find(c=>c.id===p.caseId); if(kase){ kase.status='recovered'; logAudit({type:'promise', caseId:kase.id, message:'Promise <b>'+p.id+'</b> marked FULFILLED — '+fmtINR(p.amount)+' recovered.'}); } persist(); render(); toast('Promise marked fulfilled.', 'success'); }
      break;
    }
    case 'promise-break': {
      const p = S.promises.find(x=>x.id===el.getAttribute('data-id'));
      if (p){ p.status='broken'; const kase=S.cases.find(c=>c.id===p.caseId); if(kase){ kase.status='open'; kase.attempts=Math.min(kase.attempts, kase.maxAttempts-1); logAudit({type:'promise', caseId:kase.id, message:'Promise <b>'+p.id+'</b> marked BROKEN — case re-entered dunning ladder.'}); } persist(); render(); toast('Promise marked broken — case reopened.', 'warning'); }
      break;
    }
    case 'run-command': {
      const idx = parseInt(el.getAttribute('data-idx'),10);
      const cmd = COMMANDS[idx];
      closePalette();
      if (cmd) cmd.run();
      break;
    }
  }
});

function refocusEnd(selector){
  const inp = typeof selector === 'string' ? document.querySelector(selector) : selector;
  if (inp){ inp.focus(); const v = inp.value; try{ inp.setSelectionRange(v.length, v.length); }catch(e){} }
}

document.addEventListener('input', (e) => {
  // These two inputs are re-rendered by name (not via a data-action ancestor lookup),
  // since their own re-render replaces the input element and would otherwise drop focus.
  if (e.target.id === 'palette-input'){
    S.ui.paletteQuery = e.target.value; S.ui.paletteSel = 0;
    renderPalette();
    refocusEnd('#palette-input');
    return;
  }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.getAttribute('data-action');
  switch(action){
    case 'filter-cases-query':
      S.filters.casesQuery = el.value; renderCasesTableOnly();
      refocusEnd('[data-action="filter-cases-query"]');
      break;
    case 'filter-audit-query':
      S.filters.auditQuery = el.value; renderAuditTableOnly();
      refocusEnd('[data-action="filter-audit-query"]');
      break;
    case 'policy-input': {
      const key = el.getAttribute('data-key');
      let v = parseFloat(el.value);
      if (isNaN(v)) return;
      if (key === 'confidenceThreshold') v = clamp(v,0,100)/100; else v = Math.max(0,v);
      Policy[key] = v; persist();
      break;
    }
  }
});

document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.getAttribute('data-action');
  if (action === 'filter-cases-type'){ S.filters.casesType = el.value; renderCasesTableOnly(); }
  if (action === 'filter-cases-status'){ S.filters.casesStatus = el.value; renderCasesTableOnly(); }
  if (action === 'filter-audit-type'){ S.filters.auditType = el.value; renderAuditTableOnly(); }
});

document.addEventListener('keydown', (e) => {
  const meta = e.ctrlKey || e.metaKey;
  if (meta && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); S.ui.paletteOpen ? closePalette() : openPalette(); return; }
  if (e.key === 'Escape'){
    if (S.ui.paletteOpen){ closePalette(); return; }
    if (S.ui.drawerCaseId){ S.ui.drawerCaseId=null; render(); return; }
  }
  if (S.ui.paletteOpen){
    const q = (S.ui.paletteQuery||'').toLowerCase();
    const filtered = COMMANDS.filter(c => c.label.toLowerCase().includes(q));
    if (e.key === 'ArrowDown'){ e.preventDefault(); S.ui.paletteSel = clamp((S.ui.paletteSel||0)+1, 0, filtered.length-1); renderPalette(); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); S.ui.paletteSel = clamp((S.ui.paletteSel||0)-1, 0, filtered.length-1); renderPalette(); }
    if (e.key === 'Enter'){
      const cmd = filtered[clamp(S.ui.paletteSel||0,0,filtered.length-1)];
      closePalette();
      if (cmd) cmd.run();
    }
  }
  if (S.view === 'voice' && e.key === 'Enter' && document.activeElement && document.activeElement.id === 'voice-text-input'){
    const inp = document.activeElement;
    if (inp.value.trim() && S.voice.activeCaseId){ handleVoiceUserUtterance(inp.value.trim()); inp.value=''; }
  }
});

/* Lightweight partial re-renders to avoid losing input focus while typing filters */
function renderCasesTableOnly(){ if (S.view==='cases'){ const el=$('#view-scroll'); if(el) el.innerHTML = viewCases(); } }
function renderAuditTableOnly(){ if (S.view==='audit'){ const el=$('#view-scroll'); if(el) el.innerHTML = viewAudit(); } }

/* ============================================================================
   BOOT
   ============================================================================ */
function boot(){
  const restored = restore();
  if (!restored) seedData();
  if (window.speechSynthesis){ window.speechSynthesis.onvoiceschanged = () => {}; }
  render();
}

// Debug/inspection surface for judges & QA — read-only view into live state, plus safe demo actions.
window.RecoverAI = {
  get state(){ return S; },
  get policy(){ return Policy; },
  runBatch, resetDemo, exportAudit, navigate,
};

boot();
</script>
