<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b1024;--p1:#111936;--p2:#171f43;--p3:#202a52;--ln:#293456;--ln2:#3a4770;--tx:#f6f8ff;--mut:#aab4d0;--dim:#7783a8;--grn:#22c55e;--grn2:#4ade80;--red:#ef4444;--red2:#f87171;--amb:#f59e0b;--amb2:#fbbf24;--blu:#3b82f6;--blu2:#70a4ff;--vio:#8b5cf6;--vio2:#b8a4ff;--pink:#ec4899;--fd:'Space Grotesk',sans-serif;--fb:'Manrope',sans-serif;--fm:'JetBrains Mono',monospace}
html{color-scheme:dark}
html.light{color-scheme:light}body.light{--bg:#f4f7fb;--p1:#fff;--p2:#f8fafc;--p3:#eef2f7;--ln:#dfe5ee;--ln2:#cbd5e1;--tx:#172033;--mut:#526174;--dim:#718096}body.light .side,body.light .top{background:rgba(255,255,255,.94)}body.light .tstrip{background:#fff8e6;border-color:#f2d38a}body.light .voice-topbar{background:linear-gradient(135deg,#f5efff,#fff)}body.light .voice-call-header{background:linear-gradient(90deg,#fff0f8,#f4efff)}body.light ::-webkit-scrollbar-thumb{background:#cbd5e1;border-color:#f4f7fb}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:13.5px;line-height:1.55;overflow-x:hidden}
::selection{background:rgba(34,197,94,.25)}

::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#232328;border-radius:8px;border:2px solid #000}::-webkit-scrollbar-track{background:transparent}

.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 26px;background:rgba(11,16,36,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.crumb b{font-size:15px;font-weight:700;font-family:var(--fd)}

.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.mode-wrap{position:relative}.mode-chip{font-size:11px;font-weight:700;color:#86efac;padding:6px 10px;border-radius:99px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.22);white-space:nowrap}.mode-chip:first-letter{color:#22c55e}.mode-chevron{margin-left:4px;color:var(--mut);font-size:13px}.mode-menu{display:none;position:absolute;right:0;top:38px;z-index:80;width:210px;padding:6px;background:var(--p1);border:1px solid var(--ln2);border-radius:9px;box-shadow:0 16px 40px rgba(0,0,0,.35)}.mode-menu.show{display:block}.mode-menu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:9px 10px;border-radius:6px;text-align:left;font-size:11px;font-weight:700}.mode-menu button small{margin-top:2px;color:var(--dim);font-size:9px;font-weight:500}.mode-selected{color:var(--grn2);background:rgba(34,197,94,.08)}.mode-disabled{color:var(--dim);cursor:not-allowed}

.account-stat{display:flex;flex-direction:column;gap:4px;padding:25px 24px;border-bottom:1px solid var(--ln)}.account-stat b{font:700 28px var(--fd);color:var(--grn2)}.account-stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.detail-list{display:flex;flex-direction:column;gap:0}.detail-list>div{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--ln)}.detail-list span{color:var(--mut);font-size:11px}.detail-list b{font-size:11px}
.integration-url label,.webhook-form label{display:block;font:700 10px var(--fm);color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.integration-url>div{display:flex;gap:7px}.integration-url input,.webhook-form input,.webhook-form select{width:100%;box-sizing:border-box;min-height:34px;padding:8px 10px;border:1px solid var(--ln2);border-radius:7px;background:var(--p1);color:var(--tx);font-size:11px}.integration-url small,.form-note{display:block;color:var(--dim);font-size:10px;margin-top:6px}.webhook-form{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;padding:18px 20px;background:var(--p2);border-bottom:1px solid var(--ln)}.webhook-form .form-note{grid-column:1/-1;margin:0}.webhook-list{padding:0 20px}.webhook-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}.webhook-row>div{min-width:0;flex:1}.webhook-row b,.webhook-row small{display:block}.webhook-row small{color:var(--mut);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;border:1px solid transparent;transition:.12s;min-height:34px;white-space:nowrap;cursor:pointer}

.toast .tic svg{width:14px;height:14px}
.toast b{display:block;font-size:12px}.toast p{font-size:11px;color:var(--mut);margin-top:1px}
.toast.s{border-left-color:var(--grn)}.toast.s .tic{background:rgba(34,197,94,.12);color:var(--grn2)}
.toast.e{border-left-color:var(--red)}.toast.e .tic{background:rgba(239,68,68,.14);color:var(--red2)}
.toast.w{border-left-color:var(--amb)}.toast.w .tic{background:rgba(245,158,16,.12);color:var(--amb2)}

<script>
/* ═══ STATE ═══
   S.cases / S.audit are always the real backend rows (normalized onto the
   field names the render*() functions below expect). Nothing here is
   client-generated — see Api + normalizeCase/normalizeAuditEntry. */
var S={page:'overview',cases:[],audit:[],dashboard:null,live:false,loading:true,loadError:null,armed:false,running:false,filter:'all',statusFilter:'all',search:'',caseView:'table',theme:'dark',navKey:'Home',
voiceCase:null,voiceSearch:'',voiceLang:'hi-IN',voiceActive:false,voiceEnding:false,voiceMsgs:[],voiceStage:'idle',voiceListening:false,voiceSpeaking:false,voiceBusy:false,voiceTimer:null,voiceStartTime:0,voiceConsent:false,voiceConfidence:0,voiceIntent:'DISCOVERY',voiceVoiceName:'Browser voice',voiceTurn:0,voiceUnclearStreak:0,voiceLastSpeechEndedAt:0,voiceLastAgentSpeech:'',voiceLastAgentSpeechAt:0,voiceListeningToken:0,
auditFilter:'all',auditSearch:'',transactionTab:'payments',reportsTab:'overview',settingsTab:'general',accountTab:'profile',webhookTestLog:[],integrationBase:'',batchLog:[],batchStats:null,batchHistory:[],batchTotal:0,agentPaused:false,pbStats:{},selectedPlaybook:null,history:{risk:[],recovered:[],rate:[],open:[],escalated:[]}};
/* Mirrors backend/app/config.py Settings exactly — not editable here, this
   panel just displays what the server actually enforces. */
var POLICY={maxAmount:50000,maxRetries:2,rateExecute:'20/minute',rateDemo:'10/minute'};
var TERMINAL_STATES=['recovered','blocked','needs_human_review','skipped','awaiting_payment','closed'];
function isTerminalCase(c){return !!c&&TERMINAL_STATES.indexOf(String(c.recovery_status||c.status||'').toLowerCase())!==-1;}
// The Unicode rupee sign renders identically (and reads correctly aloud via
// TTS) in every script -- unlike the Latin abbreviation "Rs.", which used to
// break language purity in every non-English voice reply.
function fmtINR(n){return '₹'+Math.round(n).toLocaleString('en-IN');}
function fmt(n){if(n>=100000)return 'Rs.'+(n/100000).toFixed(1)+'L';if(n>=1000)return 'Rs.'+(n/1000).toFixed(1)+'K';return 'Rs.'+Math.round(n).toLocaleString('en-IN');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
// \w alone is ASCII-only, so this used to silently strip every Devanagari /
// Tamil / Kannada / Telugu / Bengali / Malayalam character to nothing --
// real speech recognition in those languages returns native-script text, so
// intent matching against it always fell through to the generic fallback.
// \p{L}/\p{N} (with the u flag) match letters/digits in any script.
function norm(s){return String(s).toLowerCase().replace(/[^\p{L}\p{N}\p{M}\s']/gu,' ').replace(/\s+/g,' ').trim();}
function pretty(s){return String(s||'').replace(/_/g,' ');}
function nowTs(){return new Date().toTimeString().slice(0,8);}
function applyTheme(theme){
 S.theme=theme==='light'?'light':'dark';
 document.documentElement.classList.toggle('light',S.theme==='light');
 document.body.classList.toggle('light',S.theme==='light');
 try{localStorage.setItem('recoverai-theme',S.theme);}catch(e){}
 var btn=document.getElementById('themeBtn');if(btn)btn.textContent=S.theme==='light'?'Dark':'Light';
}
function loadWorkspaceConfig(){try{S.integrationBase=localStorage.getItem('recoverai-integration-base')||location.origin;}catch(e){S.integrationBase=location.origin;}}
function saveWorkspaceConfig(){try{localStorage.setItem('recoverai-integration-base',S.integrationBase||location.origin);}catch(e){}}
function toggleTheme(){applyTheme(S.theme==='light'?'dark':'light');}
try{S.theme=localStorage.getItem('recoverai-theme')||'dark';}catch(e){}
applyTheme(S.theme);
function relTime(iso){if(!iso)return '—';var ms=Date.now()-new Date(iso).getTime();var h=Math.floor(ms/3600000);if(h<1)return 'just now';if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
/* ═══ API CLIENT — every call below hits the real FastAPI backend ═══ */
var API_BASE=window.RECOVERAI_API_BASE||'';
var API_KEY=window.RECOVERAI_API_KEY||'';
function apiRequest(method,path,body,headers){
 var requestHeaders={'Content-Type':'application/json'};if(API_KEY)requestHeaders['X-API-Key']=API_KEY;Object.keys(headers||{}).forEach(function(k){requestHeaders[k]=headers[k];});
 return fetch(API_BASE+path,{method:method,headers:requestHeaders,body:body!==undefined?JSON.stringify(body):undefined})
  .then(function(r){
   return r.json().catch(function(){return {};}).then(function(data){
    if(!r.ok){var msg=(data&&data.error&&data.error.message)||data.detail||('HTTP '+r.status);var e=new Error(msg);e.status=r.status;throw e;}
    return data;
   });
  });
}
var Api={
 seed:function(){return apiRequest('POST','/api/demo/seed');},
 reset:function(){return apiRequest('POST','/api/demo/reset');},
 dashboard:function(){return apiRequest('GET','/api/dashboard/summary');},
 cases:function(qs){return apiRequest('GET','/api/cases'+(qs?('?'+qs):''));},
 case:function(id){return apiRequest('GET','/api/cases/'+encodeURIComponent(id));},
 execute:function(id){return apiRequest('POST','/api/execution/execute',{case_id:String(id)},{'Idempotency-Key':'recoverai-execute-'+String(id)+'-'+Date.now()});},
 audit:function(qs){return apiRequest('GET','/api/audit'+(qs?('?'+qs):''));},
 batch:function(){return apiRequest('POST','/api/demo/recovery-batch');},
 simulateFailure:function(){return apiRequest('POST','/api/demo/simulate-failure');},
 recordVoiceEvent:function(caseId,body){return apiRequest('POST','/api/cases/'+encodeURIComponent(caseId)+'/voice-events',body);},
 verifyAudit:function(id){return apiRequest('GET','/api/audit/'+encodeURIComponent(id)+'/verify');},
 verifyChain:function(){return apiRequest('GET','/api/audit/chain/verify');},
 // Sends a REAL, accurately-shaped Razorpay webhook delivery straight to
 // /api/webhooks/razorpay -- payload.payment.entity.id nesting and an
 // X-Razorpay-Event-Id header, exactly what a live Razorpay webhook sends
 // (not this app's older simplified test shape). Works unsigned out of the
 // box because the demo runs with RAZORPAY_SIMULATE=true and no
 // WEBHOOK_SECRET configured -- the same rule a real signed delivery
 // would need WEBHOOK_SECRET set on both ends to satisfy.
 sendTestWebhook:function(eventType,paymentId){
  var pid=paymentId||('pay_test_'+Date.now().toString(36));
  var body={entity:'event',account_id:'acc_test_demo',event:eventType,
   contains:eventType==='payment_link.paid'?['payment_link','payment']:['payment'],
   payload:{payment:{entity:{id:pid,status:eventType==='payment.failed'?'failed':'captured'}}},
   created_at:Math.floor(Date.now()/1000)};
  if(eventType==='payment_link.paid')body.payload.payment_link={entity:{id:'plink_test_'+Date.now().toString(36),status:'paid'}};
  if(eventType==='refund.processed'){body.payload={refund:{entity:{id:'rfnd_test_'+Date.now().toString(36),payment_id:pid,status:'processed'}}};body.contains=['refund'];}
  return apiRequest('POST','/api/webhooks/razorpay',body,{'X-Razorpay-Event-Id':'evt_test_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)});
 }
};
/* ═══ NORMALIZATION — real API shapes → the field names render*() expects ═══ */
var CATEGORY_META={
 temporary_gateway_failure:{code:'GW_TIMEOUT',name:'Gateway Timeout'},
 invalid_instrument:{code:'INVALID_CARD',name:'Invalid Card Details'},
 customer_liquidity_issue:{code:'INSUF',name:'Insufficient Funds'},
 bank_rejection:{code:'BANK_DECLINE',name:'Bank Rejection'},
 user_abandonment:{code:'ABANDON',name:'Checkout Abandoned'}
};
var STATUS_MAP={pending:'open',failed:'open',recovered:'recovered',awaiting_payment:'awaiting',needs_human_review:'escalated',blocked:'escalated',skipped:'skipped',closed:'closed'};
function normalizeCase(item){
 var cm=CATEGORY_META[item.failure_category]||{code:'UNKNOWN',name:pretty(item.failure_category||'unknown')};
 var risk=(item.risk_level||'medium').toLowerCase();
 return {id:item.id,customer:item.customer_name||'Unknown',amount:item.amount!=null?item.amount:(item.amount_at_risk||0),
  risk:risk,category:{code:cm.code,name:cm.name,risk:risk},failure_category:item.failure_category,
  status:STATUS_MAP[item.recovery_status]||'open',recovery_status:item.recovery_status,
  action:pretty(item.recommended_action),recommended_action:item.recommended_action,
  txn:item.payment_id,created:relTime(item.created_at),createdAt:item.created_at,
  attempts:item.retry_count||0,maxAttempts:item.max_retries!=null?item.max_retries:POLICY.maxRetries,
  recovered_amount:item.recovered_amount||0,compliance_score:item.compliance_score||0,next_retry_at:item.next_retry_at||null};
}
/* Every backend event_type maps onto one of the 6 audit lanes below — VOICE
   is the one lane with no analogue in the original design (added since the
   voice agent's real actions are persisted as real audit rows too). */
var EVENT_MAP={
 payment_failure_detected:{type:'DETECTION',color:'#3b82f6'},
 analysis_completed:{type:'DIAGNOSIS',color:'#8b5cf6'},
 policy_check_passed:{type:'DECISION',color:'#f59e0b'},
 policy_check_failed:{type:'DECISION',color:'#f59e0b'},
 recovery_attempted:{type:'EXECUTION',color:'#22c55e'},
 recovery_succeeded:{type:'EXECUTION',color:'#22c55e'},
 recovery_failed:{type:'EXECUTION',color:'#22c55e'},
 recovery_skipped:{type:'EXECUTION',color:'#fbbf24'},
 razorpay_webhook_received:{type:'DETECTION',color:'#3b82f6'},
 escalated_to_human:{type:'ESCALATION',color:'#ef4444'},
 demo_reset:{type:'DECISION',color:'#f59e0b'},
 failure_simulation_armed:{type:'DECISION',color:'#f59e0b'},
 voice_call_started:{type:'VOICE',color:'#ec4899'},
 voice_call_ended:{type:'VOICE',color:'#ec4899'},
 voice_promise_captured:{type:'VOICE',color:'#ec4899'},
 voice_dispute_raised:{type:'VOICE',color:'#ec4899'}
};
function normalizeAuditEntry(item){
 var m=EVENT_MAP[item.event_type]||{type:'DECISION',color:'#9d9da6'};
 var desc=(item.case_id||'system')+' — '+pretty(item.event_type||'event');
 if(item.reason)desc+=': '+item.reason;
 var result=item.result?String(item.result).toUpperCase():(m.type==='ESCALATION'?'ESCALATED':(item.event_type==='policy_check_failed'?'BLOCKED':'SUCCESS'));
 return {id:item.id,type:m.type,color:m.color,desc:desc,actor:item.actor||'system',decision:item.decision||'—',eventHash:item.event_hash||'',previousHash:item.previous_hash||'',
  reason:item.reason||'',result:result,ts:item.timestamp?new Date(item.timestamp).toTimeString().slice(0,8):nowTs(),caseId:item.case_id||null,raw:item};
}
function trackMetric(key,val){var h=S.history[key];if(!h)return;h.push(val);if(h.length>20)h.shift();}
/* ═══ DATA LOADING ═══ */
function pendingCases(){return S.cases.filter(function(c){return c.recovery_status==='pending';});}
function openCount(){return S.cases.filter(function(c){return c.status==='open';}).length;}
function updateConnBadge(){
 var wrap=document.getElementById('connWrap'),txt=document.getElementById('connTxt');
 if(!wrap)return;
 wrap.classList.remove('demo','bad');
 if(S.live){txt.textContent='API Connected';}
 else{wrap.classList.add('bad');txt.textContent='Backend Unavailable';}
}
function refreshCasesAndAudit(){
 return Promise.all([Api.cases('limit=100'),Api.audit('limit=200')]).then(function(r){
  S.cases=(r[0].items||[]).map(normalizeCase);
  S.audit=(r[1].items||[]).map(normalizeAuditEntry);
 });
}
function refreshDashboard(){
 return Api.dashboard().then(function(d){
  S.dashboard=d;
  trackMetric('risk',d.revenue_at_risk);trackMetric('recovered',d.recovered_amount);trackMetric('rate',d.recovery_rate);
  trackMetric('open',S.cases.filter(function(c){return c.status==='open';}).length);
  trackMetric('escalated',S.cases.filter(function(c){return c.status==='escalated';}).length);
 });
}
function loadInitialData(){
 S.loading=true;S.loadError=null;renderShell();
 Api.cases('limit=1').then(function(probe){
  return probe.total?Promise.resolve():Api.seed();
 }).then(function(){
  return refreshCasesAndAudit();
 }).then(function(){
  return refreshDashboard();
 }).then(function(){
  S.live=true;S.loading=false;updateConnBadge();
  go('overview');
 }).catch(function(err){
  S.live=false;S.loading=false;S.loadError=err.message||String(err);updateConnBadge();renderShell();
 });
}
function renderShell(){
 var el=document.getElementById('content');if(!el)return;
 if(S.loading){el.innerHTML='<div class="card"><div class="empty" style="padding:60px"><h4>Loading RecoverAI…</h4><p>Connecting to the backend and seeding demo data if needed.</p></div></div>';return;}
 if(!S.live){el.innerHTML='<div class="card"><div class="empty" style="padding:60px"><h4 style="color:var(--red2)">Backend unavailable</h4><p>'+esc(S.loadError||'Could not reach the RecoverAI API.')+'</p><p style="margin-top:6px">Start it with <span class="mono">uvicorn app.main:app --port 8000</span> from <span class="mono">backend/</span>, then retry.</p><button class="btn btn-p" style="margin-top:14px" data-act="retry-load">Retry</button></div></div>';}
}
/* ═══ CONSTANTS (structural — playbook copy/labels only, not data) ═══ */
var PLAYBOOKS=[
 {id:'degradation',name:'Payment Degradation Scan',desc:'Detects gateway timeouts and invalid-instrument declines, retries via the recommended action',color:'#22c55e',
  filterFn:function(c){return c.status==='open'&&(c.failure_category==='temporary_gateway_failure'||c.failure_category==='invalid_instrument');}},
 {id:'checkout',name:'Checkout Recovery',desc:'Sends smart payment links / reminders for abandoned checkouts',color:'#3b82f6',

function derivePromises(){
 var byId={};S.cases.forEach(function(c){byId[c.id]=c;});
 return S.audit.filter(function(e){return e.raw&&e.raw.event_type==='voice_promise_captured';}).map(function(e){
  var c=byId[e.caseId];var capturedAt=e.raw.timestamp?new Date(e.raw.timestamp).getTime():Date.now();var dueAt=capturedAt+2*86400000;
  var status='pending';
  if(c&&c.recovery_status==='recovered')status='fulfilled';else if(Date.now()>dueAt)status='broken';
  return {id:e.id,customer:c?c.customer:(e.caseId||'Unknown'),amount:c?c.amount:0,capturedAt:capturedAt,dueAt:dueAt,source:'Voice Call',status:status,caseId:e.caseId,transcript:e.raw.reason||''};
 }).sort(function(a,b){return b.capturedAt-a.capturedAt;});
}

function runBatch(){
 if(S.running)return;if(S.agentPaused){toast('w','Agent Paused','Resume the agent from the control plane before starting a batch.');return;}
 var pending=pendingCases();
 if(pending.length===0){toast('w','No Pending Cases','No pending cases to recover. Seed data or all cases processed.');return;}
 S.running=true;
 S.batchLog=[];S.batchStats=null;S.batchTotal=pending.length;
 go('batch');
 blogPush('lt','--- Batch started: '+pending.length+' cases ---');
 Api.batch().then(function(result){
  return refreshCasesAndAudit().then(function(){return result;});
 }).then(function(result){
  var byId={};S.cases.forEach(function(c){byId[c.id]=c;});
  var i=0;
  function step(){
   if(i>=pending.length){
    S.running=false;
    var skippedN=result.skipped||0,awaitingN=result.awaiting||0,failedN=(result.failed!==undefined)?result.failed:Math.max(0,result.attempted-result.successful-awaitingN-result.escalated-skippedN);
    blogPush('lt','--- Done: '+result.successful+' recovered, '+awaitingN+' awaiting payment, '+result.escalated+' escalated, '+skippedN+' smart-skipped, '+failedN+' failed ---');
    S.batchStats={proc:result.attempted,rec:result.successful,awaiting:awaitingN,failed:failedN,esc:result.escalated,skp:skippedN,err:result.errored||0,amt:result.amount_recovered,cost:result.estimated_cost||0};
    S.batchHistory.unshift({ts:nowTs(),rec:result.successful,esc:result.escalated,amt:result.amount_recovered});
    if(S.batchHistory.length>6)S.batchHistory.pop();
    toast('s','Batch Complete',result.successful+' recovered · '+fmt(result.amount_recovered));
    refreshDashboard().then(softGo);
    return;
   }
   var oldCase=pending[i];var newCase=byId[oldCase.id];var ts=nowTs();
   if(newCase&&newCase.recovery_status==='recovered'){blogPush('ok','['+ts+'] RECOVERED: '+newCase.id+' - '+esc(newCase.customer)+' - '+fmtINR(newCase.recovered_amount));}
   else if(newCase&&(newCase.recovery_status==='needs_human_review'||newCase.recovery_status==='blocked')){blogPush('bad','['+ts+'] ESCALATED: '+newCase.id+' - '+esc(newCase.customer));}
   else{blogPush('skip','['+ts+'] NO CHANGE: '+oldCase.id+' - '+esc(oldCase.customer));}
   i++;setTimeout(step,300);
  }
  step();
 }).catch(function(err){S.running=false;blogPush('bad','Batch failed: '+err.message);toast('e','Batch failed',err.message);softGo();});
}

function runPlaybook(id){
 var pb=PLAYBOOKS.find(function(x){return x.id===id;});if(!pb)return;
 if(id==='voice'){toast('i','Voice Agent','Pick a case in the Voice Agent tab to start a real call.');go('voice');return;}
 var eligible=S.cases.filter(pb.filterFn);
 if(eligible.length===0){toast('w','No Cases',pb.name+': no eligible cases');return;}
 openExec(pb.name,function(){
  var results=[];

  document.getElementById('eCont').hidden=false;

function startVoiceCall(){

 setTimeout(function(){

  S.voiceMsgs.push({role:'agent',text:resp.say});S.voiceStage='permission';S.voiceLastAgentSpeech=resp.say;S.voiceLastAgentSpeechAt=Date.now();renderVoiceChat();

function startVoiceTimer(){
 if(S.voiceTimer)clearInterval(S.voiceTimer);
 S.voiceTimer=setInterval(function(){
  var el=document.getElementById('vtimer');if(!el){clearInterval(S.voiceTimer);S.voiceTimer=null;return;}
  var s=Math.floor((Date.now()-S.voiceStartTime)/1000);
  el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
 },1000);
}
function endCall(outcome,lastUtterance){
 if(!S.voiceActive||S.voiceEnding)return;S.voiceEnding=true;cleanupVoice();S.voiceActive=false;S.voiceListening=false;S.voiceSpeaking=false;S.voiceBusy=false;
 var c=S.cases.find(function(x){return x.id===S.voiceCase;});
 if(c){
  var oc={PROMISE_TO_PAY:'Payment committed',PARTIAL_PAYMENT:'Partial payment committed',REQUEST_HUMAN:'Escalated to human agent',LINK_SENT:'Link sent',CALLBACK_SCHEDULED:'Callback scheduled',CALLBACK_LATER:'Callback requested',SOFT_REFUSAL:'Customer refused',CONSENT_DECLINED:'Customer did not consent',DISPUTE_RAISED:'Dispute raised for review',COMPLETED:'Call completed',NAV_AWAY:'Ended (navigation)',MANUAL_END:'Ended by operator'};
  var isPromise=outcome==='PROMISE_TO_PAY'||outcome==='PARTIAL_PAYMENT';
  var isDispute=outcome==='DISPUTE_RAISED';
  // The backend has always accepted voice_dispute_raised (see schemas.py) --
  // it just never had a caller. A customer disputing the charge is a
  // materially different, audit-worthy outcome from a generic "call ended",
  // so it gets routed to its own event type instead of being lumped in.
  var eventType=isPromise?'voice_promise_captured':(isDispute?'voice_dispute_raised':'voice_call_ended');
  // Leave the active call screen immediately. Audit persistence is a
  // follow-up and must never trap the operator in an ended call.
  softGo();
  Api.recordVoiceEvent(c.id,{event_type:eventType,intent:outcome,language:S.voiceLang,confidence:S.voiceConfidence,consent_confirmed:S.voiceConsent,transcript:lastUtterance||oc[outcome]||outcome}).then(function(){
   return refreshCasesAndAudit();
  }).then(function(){
   refreshDashboard();softGo();S.voiceEnding=false;
  }).catch(function(err){console.warn('voice event not recorded',err);S.voiceEnding=false;toast('e','Call not saved','The call ended, but its outcome could not be written to the audit trail.');});
  toast(isPromise?'s':(outcome==='SOFT_REFUSAL'||isDispute)?'w':'i','Call Ended',oc[outcome]||outcome.replace(/_/g,' '));
 } else {S.voiceEnding=false;softGo();}
}

function palFiltered(q){return buildCmds().filter(function(c){return c.l.toLowerCase().indexOf(q.toLowerCase())>-1;});}
function renderPal(q){
 var f=palFiltered(q);
 palIdx=Math.min(palIdx,Math.max(0,f.length-1));

 f.forEach(function(c,i){if(c.g!==lastG){html+='<div class="pal-group">'+c.g+'</div>';lastG=c.g;}html+='<div class="pal-item '+(i===palIdx?'sel':'')+'" data-pal-idx="'+i+'" data-pal-run="1">'+c.l+'</div>';});

 window.__PALF=f;
}

  else if(a==='test-voice'){var sampleC={customer:'Priya Sharma',amount:2499,category:{name:'Gateway Timeout'}};speakText(VOICE_BRAIN[S.voiceLang].greeting(sampleC));}
  else if(a==='audit-filter'){S.auditFilter=type;go('audit');}
  else if(a==='toggle-json'){var nodes=document.querySelectorAll('.tlev');nodes.forEach(function(n){if(n.dataset.id===id)n.classList.toggle('raw');});}
  else if(a==='verify-chain'){
   var vbtn=document.querySelector('[data-act="verify-chain"]');if(vbtn){vbtn.disabled=true;vbtn.textContent='Verifying…';}
   Api.verifyChain().then(function(v){
    var badge=document.getElementById('chainStatus');
    if(badge){badge.className='chain-status '+(v.valid?'ok':'bad');badge.textContent=(v.valid?'✓ Chain verified':'✗ Tampering detected')+' · '+v.events_checked+' events';}
    toast(v.valid?'s':'e',v.valid?'Audit Chain Verified':'Tampering Detected',v.valid?'All '+v.events_checked+' sealed events recomputed and matched, root to tip.':'A sealed event no longer matches its recorded hash — the chain is broken.');
   }).catch(function(err){toast('e','Chain Verification Failed',err.message);}).finally(function(){if(vbtn){vbtn.disabled=false;vbtn.textContent='Verify Chain';}});
  }
  else if(a==='export-audit')exportAudit();
  else if(a==='export-report')exportReport();
  else if(a==='schedule-report')toast('i','Schedule reports','Connect a production notification provider to enable scheduled delivery.');
  else if(a==='copy-webhook-url')safeCopy(location.origin+'/api/webhooks/razorpay');
  else if(a==='send-test-webhook'){
   var evSel=document.getElementById('webhookTestEvent');var eventType=evSel?evSel.value:'payment.failed';
   var isConfirming=eventType==='payment.captured'||eventType==='payment_link.paid';
   var target=isConfirming?S.cases.find(function(c){return c.recovery_status==='awaiting_payment';}):null;
   act.disabled=true;var origTxt=act.textContent;act.textContent='Sending…';
   Api.sendTestWebhook(eventType,target?target.txn:null).then(function(r){
    S.webhookTestLog.unshift({event:eventType,ok:true,message:r.message+(target?' · matched case '+target.id+' → recovered':isConfirming?' · no awaiting_payment case to match right now':''),time:nowTs()});
    toast('s','Webhook accepted',r.message);
    return target?refreshCasesAndAudit():Promise.resolve();
   }).catch(function(err){
    S.webhookTestLog.unshift({event:eventType,ok:false,message:err.message,time:nowTs()});
    toast('e','Webhook rejected',err.message);
   }).then(function(){act.disabled=false;act.textContent=origTxt;go('settings');});
  }
  else if(a==='save-integration'){var ib=document.getElementById('integrationBase'),value=(ib&&ib.value||'').trim();try{var ip=new URL(value);if(ip.protocol!=='https:'&&!(ip.protocol==='http:'&&(ip.hostname==='localhost'||ip.hostname==='127.0.0.1'))){toast('w','Invalid base URL','Use HTTPS, or HTTP only for localhost testing.');return;}S.integrationBase=value;saveWorkspaceConfig();toast('s','Integration saved','API base URL saved for this browser.');}catch(err){toast('w','Invalid base URL','Enter a complete URL.');}}
  else if(a==='copy-integration')safeCopy(location.origin+'/api');
  else if(a==='account-action')toast('i','Test Mode','Account changes are disabled in the sandbox demo.');
  else if(a==='transaction-search')toast('i','Search complete','No matching '+(S.transactionTab==='refunds'?'refunds':S.transactionTab==='orders'?'orders':'records')+' in the sandbox dataset.');
  else if(a==='clear-transaction-filter')go(S.page);
  else if(a==='copy-txn')safeCopy(act.dataset.text);
  else if(a==='seed')doSeed();
  else if(a==='reset')doReset();
  else if(a==='close-exec')closeExec();
  else if(a==='retry-load')loadInitialData();
  return;
 }
 if(e.target.closest('#searchBtn')){openPal();return;}
 if(e.target.closest('#seedBtn')){doSeed();return;}
 var palItem=e.target.closest('[data-pal-idx]');
 if(palItem){var f=window.__PALF||[];var it=f[parseInt(palItem.dataset.palIdx,10)];if(it)it.fn();closePal();return;}
 if(e.target.closest('#eCont')){closeExec();return;}
});
document.addEventListener('keydown',function(e){
 var tag=e.target&&e.target.tagName?e.target.tagName.toUpperCase():'';
 if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'){
  if(e.key==='Escape'){e.target.blur();if(document.getElementById('palOvl').classList.contains('show'))closePal();else closeExec();}
  var inp=document.getElementById('vinput');
  if(inp&&document.activeElement===inp&&e.key==='Enter'){var v=inp.value.trim();if(v){inp.value='';voiceUserSaid(v);}}
  return;
 }
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(document.getElementById('palOvl').classList.contains('show'))closePal();else openPal();return;}
 if(e.key==='Escape'){if(document.getElementById('palOvl').classList.contains('show'))closePal();else closeExec();return;} if(e.key==='?'&&!e.metaKey&&!e.ctrlKey){openPal();return;}
 if(document.getElementById('palOvl').classList.contains('show')){
  var q=document.getElementById('palInput').value;var f=window.__PALF||palFiltered(q);
  if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palIdx+1,f.length-1);renderPal(q);}
  if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(palIdx-1,0);renderPal(q);}
  if(e.key==='Enter'&&f[palIdx]){f[palIdx].fn();closePal();}
 }
});
document.getElementById('palInput').addEventListener('input',function(e){palIdx=0;renderPal(e.target.value);});
document.addEventListener('input',function(e){
 if(e.target.id==='voiceCaseSearch'){
  S.voiceSearch=e.target.value;var cursor=e.target.selectionStart;softGo();
  setTimeout(function(){var next=document.getElementById('voiceCaseSearch');if(next){next.focus();next.setSelectionRange(cursor,cursor);}},0);
 }
});
document.addEventListener('change',function(e){if(e.target.id==='setLang'){S.voiceLang=e.target.value;toast('i','Language',VOICE_BRAIN[S.voiceLang].name);if(S.page==='settings')go('settings');}if(e.target.id==='voiceConsent'){S.voiceConsent=e.target.checked;toast(S.voiceConsent?'s':'w','Consent gate',S.voiceConsent?'Consent recorded for this test call.':'Consent cleared — call start is locked.');softGo();}if(e.target.id==='caseRiskFilter'){S.filter=e.target.value;renderCaseBody();}if(e.target.id==='caseStatusFilter'){S.statusFilter=e.target.value;renderCaseBody();}});
/* ═══ INIT ══ */
loadWorkspaceConfig();
loadInitialData();
</script>
